# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "NORA gitleaks rules"

[allowlist]
  description = "Global allowlist for false positives"
  paths = [
    '''\.gitleaks\.toml$''',
    # Synthetic test-server key, never loaded by production code.
    '''nora-registry/src/registry/transport/fixtures/server-key\.pem$''',
  ]
  regexTarget = "match"
  # Test placeholder tokens (e.g. nra_00112233...)
  regexes = ['''nra_0{2}[0-9a-f]{30}''']
